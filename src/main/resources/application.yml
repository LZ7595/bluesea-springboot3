spring:
  web:
    resources:
      # 配置静态资源路径，包含类路径下的 static 目录和文件系统中的上传目录
      static-locations:
        - classpath:/static/
        - file:/www/wwwroot/files/
      cache:
        cachecontrol:
          max-age: 0
          public: true
          private: false
          must-revalidate: false
  mvc:
    static-path-pattern: /**
  application:
    name: backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/blueseaplus
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
      password: root
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          time-between-eviction-runs: 15s
    # RabbitMQ配置
    rabbitmq:
      host: 127.0.0.1  # MQ服务地址，虚拟机环境填对应IP
      port: 5672       # 通信端口
      username: guest  # 用户名，生产环境建议修改
      password: guest  # 密码，生产环境建议修改
      virtual-host: /  # 虚拟主机，默认/
      # 消息确认配置（确保消息不丢失）
      publisher-confirm-type: correlated  # 生产者确认机制
      publisher-returns: true             # 消息返回机制
      listener:
        simple:
          acknowledge-mode: manual        # 消费者手动确认（避免重复消费）
          concurrency: 1                  # 消费者核心线程数
          max-concurrency: 5              # 消费者最大线程数
  mail:
    host: smtp.qq.com
    username: 2567407595@qq.com
    password: jwfteykhexkpebbg
    port: 465
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

